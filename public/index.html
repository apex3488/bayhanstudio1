<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>BAYHAN STUDIO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <style>
      html { background: #050609; color: #f4f6fa; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      a { color: #a6d9ff; margin: 0 10px; }
    </style>
    <script>
      (function () {
        var supported = ["ru", "en", "uz"];
        var pick = "ru";
        try {
          var m = document.cookie.match(/(?:^|; )bayhan_locale=(ru|en|uz)/);
          if (m) pick = m[1];
          else {
            var langs = navigator.languages || [navigator.language || "ru"];
            for (var i = 0; i < langs.length; i++) {
              var l = String(langs[i]).toLowerCase().split("-")[0];
              if (supported.indexOf(l) > -1) { pick = l; break; }
            }
          }
        } catch (e) {}
        location.replace("./" + pick);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p><a href="./ru">Русский</a><a href="./en">English</a><a href="./uz">O‘zbekcha</a></p>
    </noscript>
  </body>
</html>
